<script type="module">
    // ---------- IMPORTS ----------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, deleteDoc,
        query, where, onSnapshot, orderBy, limit, runTransaction,
        enableIndexedDbPersistence, getDocs
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { 
        getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ---------- CONFIG ----------
    const app = initializeApp(window.FIREBASE_CONFIG);
    const db = getFirestore(app);
    const auth = getAuth(app);
    enableIndexedDbPersistence(db).catch(e => console.warn("offline persistence:", e));

    const CLOUDINARY_CLOUD_NAME = window.CLOUDINARY_CLOUD_NAME;
    const CLOUDINARY_UPLOAD_PRESET = window.CLOUDINARY_UPLOAD_PRESET;

    // ---------- GLOBALS ----------
    let currentChildId = "child_umar";
    let currentTimerInterval = null;
    let timerWarningTriggered = false;
    let childBalanceUnsub = null;
    let pendingSubmissionsUnsub = null;
    let parentAuthenticated = false;
    let weeklyChartInstance = null;
    let currentZoomScale = 1;
    let videosUnsub = null;  // for live video list
    let kidHistoryUnsub = null;
    let kidRedemptionsUnsub = null;
    let kidHistoryFilter = "all";

    // Ensure children exist
    async function ensureChildrenExist() {
        for (const id of ["child_umar", "child_muaz"]) {
            const ref = doc(db, "children", id);
            const snap = await getDoc(ref);
            if (!snap.exists()) await setDoc(ref, { name: id === "child_umar" ? "Umar" : "Muaz", balanceMinutes: 0, createdAt: new Date() });
        }
    }
    ensureChildrenExist();

    // ---------- SET DEFAULT DATETIME ----------
    function setDefaultDatetime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth()+1).padStart(2,'0');
        const day = String(now.getDate()).padStart(2,'0');
        const hours = String(now.getHours()).padStart(2,'0');
        const minutes = String(now.getMinutes()).padStart(2,'0');
        document.getElementById('taskDatetime').value = `${year}-${month}-${day}T${hours}:${minutes}`;
    }
    setDefaultDatetime();

    function subscribeChildBalance(childId) {
        if (childBalanceUnsub) childBalanceUnsub();
        childBalanceUnsub = onSnapshot(doc(db, "children", childId), (docSnap) => {
            document.getElementById("balanceMinutes").innerText = docSnap.exists() ? docSnap.data().balanceMinutes : 0;
        });
    }

    // Timer with localStorage
    function manageActiveTimer() {
        if (currentTimerInterval) clearInterval(currentTimerInterval);
        const storageKey = `screen_timer_end_${currentChildId}`;
        const timerDiv = document.getElementById("liveTimerDisplay");
        function updateDisplay() {
            const end = localStorage.getItem(storageKey);
            if (!end || parseInt(end) <= Date.now()) {
                localStorage.removeItem(storageKey);
                timerDiv.innerHTML = "⏳ No active screen session";
                if (currentTimerInterval) clearInterval(currentTimerInterval);
                currentTimerInterval = null;
                timerWarningTriggered = false;
                return;
            }
            const remainingMs = parseInt(end) - Date.now();
            const min = Math.floor(remainingMs / 60000);
            const sec = Math.floor((remainingMs % 60000) / 1000);
            timerDiv.innerHTML = `🎮 SCREEN TIME ACTIVE: ${min}m ${sec}s left`;
            if (remainingMs <= 300000 && !timerWarningTriggered) {
                timerWarningTriggered = true;
                timerDiv.style.background = "#ffedd5";
                timerDiv.innerHTML += " ⚠️ 5 minutes left!";
            }
        }
        updateDisplay();
        currentTimerInterval = setInterval(updateDisplay, 1000);
    }

    async function redeemMinutes(minutes) {
        const existingEnd = localStorage.getItem(`screen_timer_end_${currentChildId}`);
        if (existingEnd && parseInt(existingEnd) > Date.now()) return alert("⏰ You already have an active timer!");
        const childRef = doc(db, "children", currentChildId);
        try {
            await runTransaction(db, async (transaction) => {
                const snap = await transaction.get(childRef);
                const balance = snap.data()?.balanceMinutes || 0;
                if (balance < minutes) throw new Error(`Insufficient balance (${balance} min left)`);
                transaction.update(childRef, { balanceMinutes: balance - minutes });
                await transaction.set(doc(collection(db, "redemptions")), { childId: currentChildId, minutes, createdAt: new Date(), type: "redemption" });
            });
            localStorage.setItem(`screen_timer_end_${currentChildId}`, (Date.now() + minutes * 60000).toString());
            timerWarningTriggered = false;
            manageActiveTimer();
            alert(`✅ ${minutes} minutes redeemed! Timer started.`);
        } catch (err) { 
            console.error("Redeem error details:", err);
            alert("Redeem failed: " + err.message);
        }
    }

    // ----- CLOUDINARY UPLOAD -----
    async function resizeImageToBlob(file, maxWidth = 1200, quality = 0.85) {
        if (!file.type.startsWith('image/')) return file;
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
                };
                img.onerror = reject;
            };
            reader.onerror = reject;
        });
    }

    async function uploadToCloudinary(fileBlob) {
        const formData = new FormData();
        formData.append("file", fileBlob);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
        const response = await fetch(url, { method: "POST", body: formData });
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error.message);
        }
        const data = await response.json();
        return data.secure_url;
    }

    // ---------- SUBMIT STUDY REQUEST ----------
    async function submitStudyRequest() {
        const subject = document.getElementById("studySubject").value.trim();
        const description = document.getElementById("studyDesc").value.trim();
        const datetime = document.getElementById("taskDatetime").value;
        const fileInput = document.getElementById("proofFile");
        const statusDiv = document.getElementById("uploadStatus");

        if (!subject) return alert("Enter a subject");
        if (!datetime) return alert("Please select date and time");
        if (!fileInput.files.length) return alert("Select a photo/video");
        let file = fileInput.files[0];
        if (file.size > 10 * 1024 * 1024) return alert("Max 10MB");

        statusDiv.innerText = "📤 Resizing & uploading...";
        try {
            const resized = await resizeImageToBlob(file);
            const imageUrl = await uploadToCloudinary(resized);
            await addDoc(collection(db, "submissions"), {
                childId: currentChildId,
                subject,
                description,
                photoURL: imageUrl,
                taskDatetime: datetime,
                status: "pending",
                earnedMinutes: 0,
                createdAt: new Date(),
                approvedAt: null,
                approvedBy: null
            });
            statusDiv.innerHTML = "✅ Submitted! Waiting for parent approval.";
            document.getElementById("studySubject").value = "";
            document.getElementById("studyDesc").value = "";
            document.getElementById("taskDatetime").value = "";
            fileInput.value = "";
            setDefaultDatetime();
        } catch (err) {
            statusDiv.innerHTML = "❌ Upload error: " + err.message;
        }
    }

    // ---------- PARENT VIDEO MANAGER ----------
    async function addVideo() {
        const input = document.getElementById('videoUrlInput');
        let value = input.value.trim();
        if (!value) return alert('Please enter a YouTube URL or video ID.');

        // Extract video ID from URL if needed
        let videoId = value;
        const urlMatch = value.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#]+)/);
        if (urlMatch) videoId = urlMatch[1];
        // If it's still a full URL, we'll try to extract via regex
        if (videoId.includes('youtube') || videoId.includes('youtu.be')) {
            const match2 = videoId.match(/(?:v=|embed\/|youtu\.be\/)([^&?#]+)/);
            if (match2) videoId = match2[1];
            else return alert('Could not extract video ID. Please paste a valid YouTube URL or video ID.');
        }

        // Remove any extra query params
        videoId = videoId.split('?')[0].split('&')[0];

        if (videoId.length < 5) return alert('Invalid video ID.');

        // Fetch video title using YouTube's oEmbed API (public, no key needed)
        let title = `Video ${videoId}`;
        try {
            const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
            if (response.ok) {
                const data = await response.json();
                title = data.title || title;
            }
        } catch(e) { console.warn('Could not fetch title:', e); }

        // Save to Firestore
        await addDoc(collection(db, "videos"), {
            videoId: videoId,
            title: title,
            addedBy: auth.currentUser?.uid || 'parent',
            createdAt: new Date()
        });
        input.value = '';
        alert('✅ Video added!');
        loadParentVideoList(); // refresh list
    }

    async function approveSubmission(id) {
        const slider = document.getElementById(`slider_${id}`);
        const earned = parseInt(slider?.value || 20);
        const subRef = doc(db, "submissions", id);
        const subSnap = await getDoc(subRef);
        if (!subSnap.exists()) return;
        const childId = subSnap.data().childId;
        const childRef = doc(db, "children", childId);
        await runTransaction(db, async (tr) => {
            const child = await tr.get(childRef);
            const newBalance = (child.data()?.balanceMinutes || 0) + earned;
            tr.update(childRef, { balanceMinutes: newBalance });
            tr.update(subRef, { status: "approved", earnedMinutes: earned, approvedAt: new Date(), approvedBy: auth.currentUser?.uid });
        });
        alert(`Approved! Added ${earned} minutes.`);
    }

    async function rejectSubmission(id) {
        await updateDoc(doc(db, "submissions", id), { status: "rejected" });
        alert("Rejected.");
    }

    async function manualAdjust(childId, delta) {
        const reason = document.getElementById("manualReason")?.value.trim() || "No reason provided";
        const childRef = doc(db, "children", childId);
        await runTransaction(db, async (tr) => {
            const snap = await tr.get(childRef);
            const newBal = (snap.data()?.balanceMinutes || 0) + delta;
            if (newBal < 0) throw new Error("Balance can't go negative");
            tr.update(childRef, { balanceMinutes: newBal });
            await tr.set(doc(collection(db, "redemptions")), { childId, minutes: delta, type: "manual_adjust", createdAt: new Date(), note: "Parent adjusted", reason: reason });
        });
        document.getElementById("manualReason").value = "";
        alert(`Balance updated (${delta > 0 ? '+' : ''}${delta} min)\nReason: ${reason}`);
        refreshChildBalances();
    }

    // ---------- KID HISTORY ----------
    function loadKidHistory() {
        if (kidHistoryUnsub) kidHistoryUnsub();
        if (kidRedemptionsUnsub) kidRedemptionsUnsub();
        const subQ = query(collection(db, "submissions"), where("childId", "==", currentChildId), orderBy("createdAt", "desc"), limit(50));
        const redQ = query(collection(db, "redemptions"), where("childId", "==", currentChildId), orderBy("createdAt", "desc"), limit(50));
        let submissions = [];
        let redemptions = [];

        function renderKidHistory() {
            let items = [];
            submissions.forEach(s => items.push({ ...s, sortTime: s.time, category: "submission" }));
            redemptions.forEach(r => items.push({ ...r, sortTime: r.time, category: "redemption" }));
            items.sort((a, b) => b.sortTime - a.sortTime);

            const filtered = items.filter(i => {
                if (kidHistoryFilter === "all") return true;
                if (kidHistoryFilter === "pending") return i.category === "submission" && i.status === "pending";
                if (kidHistoryFilter === "approved") return i.category === "submission" && i.status === "approved";
                if (kidHistoryFilter === "rejected") return i.category === "submission" && i.status === "rejected";
                if (kidHistoryFilter === "redemptions") return i.category === "redemption";
                return true;
            });

            const container = document.getElementById("kidHistoryList");
            if (!container) return;
            if (filtered.length === 0) {
                container.innerHTML = '<div class="history-empty">No history yet.</div>';
                return;
            }
            container.innerHTML = filtered.map(i => {
                if (i.category === "submission") {
                    const badgeClass = i.status === "approved" ? "badge-approved" : i.status === "rejected" ? "badge-rejected" : "badge-pending";
                    const earnedTxt = i.status === "approved" ? ` · ${i.earnedMinutes} min earned` : "";
                    const thumb = i.photoURL ? `<img src="${i.photoURL}" class="h-thumb" onclick="openZoom('${i.photoURL}')" onerror="this.style.display='none'">` : "";
                    return `<div class="history-item">${thumb}<div class="h-info"><strong>${i.subject}</strong><div class="meta">${i.description || ""}</div><div class="meta">📅 ${i.time ? i.time.toLocaleDateString() : ""}</div></div><span class="history-badge ${badgeClass}">${i.status}${earnedTxt}</span></div>`;
                } else {
                    const badgeClass = i.type === "manual_adjust" ? "badge-manual" : "badge-redeemed";
                    const label = i.type === "manual_adjust" ? "Adjusted" : "Redeemed";
                    const mins = i.minutes > 0 ? `+${i.minutes}` : `${i.minutes}`;
                    const reasonTxt = i.reason && i.reason !== "No reason provided" ? `<div class="meta">📝 ${i.reason}</div>` : "";
                    return `<div class="history-item"><div class="h-info"><strong>${label}: ${mins} min</strong><div class="meta">📅 ${i.time ? i.time.toLocaleString() : ""}</div>${reasonTxt}</div><span class="history-badge ${badgeClass}">${label}</span></div>`;
                }
            }).join("");
        }

        kidHistoryUnsub = onSnapshot(subQ, (snap) => {
            submissions = [];
            snap.forEach(d => {
                const data = d.data();
                submissions.push({ id: d.id, subject: data.subject, description: data.description, photoURL: data.photoURL, status: data.status, earnedMinutes: data.earnedMinutes || 0, time: data.createdAt?.toDate() });
            });
            renderKidHistory();
        }, (err) => console.error("Kid history sub error:", err));

        kidRedemptionsUnsub = onSnapshot(redQ, (snap) => {
            redemptions = [];
            snap.forEach(d => {
                const data = d.data();
                redemptions.push({ id: d.id, type: data.type, minutes: data.minutes || 0, reason: data.reason || null, time: data.createdAt?.toDate() });
            });
            renderKidHistory();
        }, (err) => console.error("Kid history red error:", err));

        subscribeChildBalance(currentChildId);
        manageActiveTimer();
        loadVideosForKids();
        loadKidHistory();
    };
    document.getElementById("parentModeBtn").onclick = () => {
        document.getElementById("parentModeBtn").classList.add("active");
        document.getElementById("kidModeBtn").classList.remove("active");
        document.getElementById("kidSection").style.display = "none";
        document.getElementById("parentSection").style.display = "block";
        if (parentAuthenticated) showParentContent(true);
        else showParentContent(false);
        if (videosUnsub) { videosUnsub(); videosUnsub = null; }
        if (kidHistoryUnsub) { kidHistoryUnsub(); kidHistoryUnsub = null; }
        if (kidRedemptionsUnsub) { kidRedemptionsUnsub(); kidRedemptionsUnsub = null; }
    };

    // Kid UI listeners
    document.querySelectorAll(".kid-avatar").forEach(el => {
        el.onclick = () => {
            document.querySelectorAll(".kid-avatar").forEach(c=>c.classList.remove("selected"));
            el.classList.add("selected");
            currentChildId = el.getAttribute("data-child");
            subscribeChildBalance(currentChildId);
            manageActiveTimer();
            loadKidHistory();
        };
    });
    document.querySelectorAll(".redeem-btn").forEach(btn => btn.onclick = () => redeemMinutes(parseInt(btn.getAttribute("data-minutes"))));
    document.getElementById("submitStudyBtn").onclick = submitStudyRequest;

    // Parent tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            const tab = btn.getAttribute("data-tab");
            document.getElementById("approvalsTab").style.display = tab === "approvals" ? "block" : "none";
            document.getElementById("historyTab").style.display = tab === "history" ? "block" : "none";
            document.getElementById("adminTab").style.display = tab === "admin" ? "block" : "none";
            document.getElementById("auditTab").style.display = tab === "audit" ? "block" : "none";
            document.getElementById("chartTab").style.display = tab === "chart" ? "block" : "none";
            document.getElementById("videosTab").style.display = tab === "videos" ? "block" : "none";
            if (tab === "audit") loadAuditLog();
            if (tab === "chart") loadWeeklyChart();
            if (tab === "admin") refreshChildBalances();
            if (tab === "videos") loadParentVideoList();
            if (tab === "history") loadParentHistory();
        };
    });

    document.getElementById("applyManualAdjust").onclick = () => {
        const child = document.getElementById("manualChildSelect").value;
        const mins = parseInt(document.getElementById("manualMinutes").value);
        if (!isNaN(mins)) manualAdjust(child, mins);
    };
    document.getElementById("addVideoBtn").onclick = addVideo;

    // Kid history filter buttons
    document.querySelectorAll("[data-kid-filter]").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll("[data-kid-filter]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            kidHistoryFilter = btn.getAttribute("data-kid-filter");
            loadKidHistory();
        };
    });
    // Parent history filter buttons
    document.querySelectorAll("[data-parent-filter]").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll("[data-parent-filter]").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            parentHistoryFilter = btn.getAttribute("data-parent-filter");
            loadParentHistory();
        };
    });

    // Make deleteVideo globally available for onclick
    window.deleteVideo = deleteVideo;

    // init kid mode
    document.querySelector(".kid-avatar").classList.add("selected");
    subscribeChildBalance(currentChildId);
    manageActiveTimer();
    loadVideosForKids();
    loadKidHistory();
</script>
</body>
</html>
